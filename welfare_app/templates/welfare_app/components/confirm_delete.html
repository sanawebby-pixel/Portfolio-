<!-- Delete Confirmation Modal (Alpine.js) -->
<div x-data="{ 
        isOpen: false, 
        deleteUrl: '', 
        itemTitle: '',
        
        openModal(url, title) {
            this.deleteUrl = url;
            this.itemTitle = title;
            this.isOpen = true;
        }
    }" 
    @open-delete-modal.window="openModal($event.detail.url, $event.detail.title)"
    @keydown.escape.window="isOpen = false"
    x-cloak>
    
    <!-- Backdrop -->
    <div x-show="isOpen" 
         x-transition.opacity
         class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm"
         aria-hidden="true"></div>

    <!-- Modal -->
    <div x-show="isOpen"
         class="fixed inset-0 z-50 flex items-center justify-center p-4">
        
        <div x-show="isOpen"
             x-transition:enter="ease-out duration-300"
             x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
             x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
             x-transition:leave="ease-in duration-200"
             x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
             x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
             @click.outside="isOpen = false"
             class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
            
            <div class="p-6">
                <div class="flex items-start gap-4">
                    <div class="flex-shrink-0 w-10 h-10 rounded-full bg-red-100 flex items-center justify-center text-red-600">
                        <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 class="text-lg font-semibold text-slate-900">Delete Confirmation</h3>
                        <p class="mt-2 text-sm text-slate-500">
                            Are you sure you want to delete <span class="font-medium text-slate-900" x-text="itemTitle"></span>? This action cannot be undone.
                        </p>
                    </div>
                </div>
            </div>

            <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-3">
                <button @click="isOpen = false" type="button" class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors">
                    Cancel
                </button>
                <form :action="deleteUrl" method="POST" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 transition-colors shadow-sm">
                        Yes, delete it
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
