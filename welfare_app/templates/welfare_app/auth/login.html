<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BrassHealth System</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-800 antialiased font-sans min-h-screen flex items-center justify-center relative overflow-hidden">
    
    <!-- Background decorations -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-blue-600/10 blur-[100px]"></div>
        <div class="absolute top-[60%] -right-[10%] w-[40%] h-[60%] rounded-full bg-emerald-600/10 blur-[100px]"></div>
    </div>

    <div class="w-full max-w-md p-6 relative z-10">
        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8 border border-white/20 backdrop-blur-sm">
            
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-blue-600 text-white shadow-lg shadow-blue-600/20 mb-4">
                    <i data-lucide="heart-pulse" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">BrassHealth System</h1>
                <p class="text-slate-500 text-sm mt-1">Sign in to access your dashboard</p>
            </div>

            <!-- Messages & Errors -->
            {% if messages %}
                {% for message in messages %}
                <div class="mb-5 p-3.5 rounded-xl {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-800{% elif message.tags == 'success' %}bg-emerald-50 border border-emerald-200 text-emerald-800{% else %}bg-blue-50 border border-blue-200 text-blue-800{% endif %} flex items-start gap-2.5">
                    <i data-lucide="{% if message.tags == 'error' %}alert-circle{% elif message.tags == 'success' %}check-circle-2{% else %}info{% endif %}" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
                    <div class="text-xs font-semibold pt-0.5">
                        {{ message }}
                    </div>
                </div>
                {% endfor %}
            {% elif error_message %}
                <div class="mb-5 p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-800 flex items-start gap-2.5">
                    <i data-lucide="alert-circle" class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5"></i>
                    <div class="text-xs font-semibold pt-0.5">
                        {{ error_message }}
                    </div>
                </div>
            {% endif %}

            <!-- Quick Demo Credentials Hint & Auto-Fill -->
            <div class="mb-5 p-3 bg-blue-50/80 border border-blue-200/80 rounded-xl flex items-center justify-between text-xs">
                <div>
                    <div class="font-bold text-blue-900">Demo Credentials:</div>
                    <div class="font-mono text-blue-700 text-[11px] mt-0.5">admin / admin123</div>
                </div>
                <button type="button" onclick="fillAdmin()" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold shadow-sm transition">
                    Auto Fill
                </button>
            </div>

            <!-- Form -->
            <form method="post" action="{% url 'login' %}" id="loginForm" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next|default:'' }}">
                <input type="hidden" name="demo_login" id="demo_login_field" value="0">
                
                <div>
                    <label for="id_username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Username</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input type="text" name="username" id="id_username" required value="admin"
                               class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors placeholder:text-slate-400"
                               placeholder="Enter your username">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="id_password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
                    </div>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input type="password" name="password" id="id_password" required value="admin123"
                               class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors placeholder:text-slate-400"
                               placeholder="Enter your password">
                    </div>
                </div>

                <div class="pt-2 space-y-2">
                    <button type="submit" 
                            class="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl transition-all shadow-lg shadow-blue-600/20 focus:ring-4 focus:ring-blue-500/20">
                        <span>Sign In</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>

                    <button type="button" onclick="submitDemoLogin()" 
                            class="w-full flex items-center justify-center gap-2 py-2 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-xl border border-slate-200 transition">
                        <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-500"></i>
                        <span>1-Click Quick Demo Sign In</span>
                    </button>
                </div>
            </form>
            
            <div class="mt-6 text-center text-xs text-slate-500">
                &copy; {% now "Y" %} Factory Welfare Dept. All rights reserved.
            </div>
        </div>
    </div>

    <script>
        function fillAdmin() {
            document.getElementById('id_username').value = 'admin';
            document.getElementById('id_password').value = 'admin123';
        }

        function submitDemoLogin() {
            document.getElementById('demo_login_field').value = '1';
            document.getElementById('loginForm').submit();
        }

        lucide.createIcons();
    </script>
</body>
</html>
