<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Welfare ERP</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-800 antialiased font-sans min-h-screen flex items-center justify-center relative overflow-hidden">
    
    <!-- Background decorations -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-blue-600/10 blur-[100px]"></div>
        <div class="absolute top-[60%] -right-[10%] w-[40%] h-[60%] rounded-full bg-emerald-600/10 blur-[100px]"></div>
    </div>

    <div class="w-full max-w-md p-6 relative z-10">
        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8 border border-white/20 backdrop-blur-sm">
            
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-blue-600 text-white shadow-lg shadow-blue-600/20 mb-4">
                    <i data-lucide="heart-pulse" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Welfare ERP</h1>
                <p class="text-slate-500 text-sm mt-1">Sign in to access your dashboard</p>
            </div>

            <!-- Messages -->
            {% if form.errors %}
                <div class="mb-6 p-4 rounded-xl bg-red-50 border border-red-100 flex items-start gap-3">
                    <i data-lucide="alert-circle" class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5"></i>
                    <div class="text-sm text-red-800 font-medium pt-0.5">
                        Please enter a correct username and password. Note that both fields may be case-sensitive.
                    </div>
                </div>
            {% endif %}

            <!-- Form -->
            <form method="post" action="{% url 'login' %}" class="space-y-5">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next|default:'' }}">
                
                <div>
                    <label for="id_username" class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input type="text" name="username" id="id_username" required
                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors placeholder:text-slate-400"
                               placeholder="Enter your username">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="id_password" class="block text-sm font-medium text-slate-700">Password</label>
                        <!-- <a href="#" class="text-xs font-medium text-blue-600 hover:text-blue-700">Forgot password?</a> -->
                    </div>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input type="password" name="password" id="id_password" required
                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors placeholder:text-slate-400"
                               placeholder="Enter your password">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" 
                            class="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition-all shadow-sm shadow-blue-600/20 focus:ring-4 focus:ring-blue-500/20">
                        <span>Sign In</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </form>
            
            <div class="mt-8 text-center text-xs text-slate-500">
                &copy; {% now "Y" %} Factory Welfare Dept. All rights reserved.
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
